---
before:
  hooks:
    - go mod tidy
builds:
  - id: serverscom-k8s-autoscaler-provider
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: serverscom-k8s-autoscaler-provider
    ldflags:
      - "-s -w -X main.version={{ if not .IsSnapshot }}v{{ end }}{{ .Version }}"

dockers:
  - build_flag_templates: [--platform=linux/amd64]
    dockerfile: Dockerfile
    goarch: amd64
    image_templates: ["ghcr.io/serverscom/serverscom-k8s-autoscaler-provider:{{ if not .IsSnapshot }}v{{ end }}{{ .Version }}-amd64"]
    use: buildx
  - build_flag_templates: [--platform=linux/arm64]
    dockerfile: Dockerfile
    goarch: arm64
    image_templates: ["ghcr.io/serverscom/serverscom-k8s-autoscaler-provider:{{ if not .IsSnapshot }}v{{ end }}{{ .Version }}-arm64v8"]
    use: buildx

docker_manifests:
  - name_template: ghcr.io/serverscom/serverscom-k8s-autoscaler-provider:{{ if not .IsSnapshot }}v{{ end }}{{ .Version }}
    image_templates:
      - ghcr.io/serverscom/serverscom-k8s-autoscaler-provider:{{ if not .IsSnapshot }}v{{ end }}{{ .Version }}-amd64
      - ghcr.io/serverscom/serverscom-k8s-autoscaler-provider:{{ if not .IsSnapshot }}v{{ end }}{{ .Version }}-arm64v8

release:
  draft: true
